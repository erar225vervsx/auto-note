name: autonote

on:
  schedule:
    - cron: "23 10 * * *"     # 毎日 19:23 JST: 調査→執筆→公開→SNS
    - cron: "47 0 * * 1"      # 毎週月曜 9:47 JST: 週次レポート
    - cron: "11 3 1,15 * *"   # 毎月1日・15日 12:11 JST: SNSトークン更新
  workflow_dispatch:
    inputs:
      command:
        description: "run / strategy / report / instagram / refresh-tokens"
        default: "run"
      dry_run:
        description: "true なら公開・投稿せずに生成物だけ作る"
        default: "false"

permissions:
  contents: write

concurrency:
  group: autonote
  cancel-in-progress: false

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NOTE_STORAGE_STATE: ${{ secrets.NOTE_STORAGE_STATE }}
      NOTE_URLNAME: ${{ vars.NOTE_URLNAME }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Decide command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "c=${{ github.event.inputs.command }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "47 0 * * 1" ]; then
            echo "c=report" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "11 3 1,15 * *" ]; then
            echo "c=refresh-tokens" >> "$GITHUB_OUTPUT"
          else
            echo "c=run" >> "$GITHUB_OUTPUT"
          fi

      - name: Run
        run: python -m autonote.pipeline ${{ steps.cmd.outputs.c }}

      - name: Save state and images
        if: always() && steps.cmd.outputs.c != 'refresh-tokens'
        run: |
          git config user.name "autonote-bot"
          git config user.email "autonote-bot@users.noreply.github.com"
          git add state public
          git diff --cached --quiet || git commit -m "autonote: ${{ steps.cmd.outputs.c }} $(date -u +%F)"
          git push

      - name: Post pending Instagram
        if: success() && steps.cmd.outputs.c == 'run'
        run: |
          sleep 90
          python -m autonote.pipeline instagram
          git add state && (git diff --cached --quiet || git commit -m "autonote: instagram") && git push

      - name: Update SNS tokens in Secrets
        if: steps.cmd.outputs.c == 'refresh-tokens'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          for k in THREADS_ACCESS_TOKEN IG_ACCESS_TOKEN; do
            v=$(python -c "import json;print(json.load(open('/tmp/new_tokens.json')).get('$k',''))")
            if [ -n "$v" ]; then echo "$v" | gh secret set "$k" --repo "$GITHUB_REPOSITORY"; fi
          done
          rm -f /tmp/new_tokens.json

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: state/screenshots
