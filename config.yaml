# ============================================================
# 自動note 運用設定
# 秘密情報(APIキー・トークン・Cookie)はここに書かず、
# GitHub の Secrets(環境変数)に入れてください。
# ============================================================

# 全体の安全スイッチ
run:
  dry_run: false            # true: 公開・投稿を行わず、生成物だけ保存
  kill_switch: false        # true: 何もせず終了(緊急停止用)
  articles_per_run: 1       # 1回の実行で公開する記事数(1〜2推奨)
  min_quality_score: 75     # 自己レビューの点数がこれ未満なら公開しない

# 戦略(ジャンル・収益モデル)
strategy:
  # 空なら AI が候補を調査して自動選定する。固定したい場合は書く
  fixed_genre: ""
  # paid_article / affiliate / free_audience / auto
  monetization: auto
  # 戦略の見直し間隔(日)
  review_interval_days: 30
  # 選定候補を出すときの制約
  constraints:
    - 医療・投資の断定的助言など、規約や法令リスクの高いジャンルは避ける
    - AIが一次情報なしで書いても価値が出るテーマを優先する
    - 継続的に記事ネタが出るジャンルを優先する

# 執筆(note への公開は手動。記事ができると「公開待ち」Issue が作られる)
writing:
  # 執筆・レビューに使うモデル。gemini-* は無料枠(GEMINI_API_KEY)、claude-* は従量課金(ANTHROPIC_API_KEY)
  model: gemini-flash-latest
  research_model: gemini-flash-lite-latest  # 調査の要約など軽い処理
  min_chars: 3000
  max_chars: 7000
  tone: "です・ます調。読者の悩みに寄り添い、具体例と手順を必ず入れる"
  # 有料記事にする場合の価格候補(AI が選ぶ)
  price_options: [300, 500, 980]
  # 記事末尾に入れる定型文(プロフィール導線・AI利用の明記など)
  footer: |
    ---
    この記事はAIを活用して作成し、公開前に自動チェックを行っています。
    内容の誤りに気づいた場合はコメントで教えてください。

# note(公開は手動)
note:
  urlname: ai_kakunin        # https://note.com/ai_kakunin
  creator_name: "AIチェック係｜生成AIを仕事で正しく使う"

# 投稿キット(GitHub Pages で公開。note・Threads・Instagram へはここのボタンから人が投稿する)
kit:
  page_url: "https://erar225vervsx.github.io/auto-note/kit"
  image_base_url: "https://raw.githubusercontent.com/erar225vervsx/auto-note/main/public/images"

# 旧設定(Instagram 画像の公開URL)。投稿キットと同じ値
sns:
  instagram:
    image_base_url: "https://raw.githubusercontent.com/erar225vervsx/auto-note/main/public/images"
